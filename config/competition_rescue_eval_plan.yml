# Local blue-team run (rescue)
# Default test layout: two bombs on open ground in Map01.
# Output: state recording (.npz) only, no video.

stat_saving_enabled: false
state_recording_enabled: true
video_capture_enabled: false
exploration_threshold_for_time_bonus: 90

evaluation_plan:
  - map_name: Map01
    team_mode: rescue
    nb_rounds: 2
    config_weight: 1
    number_drones: 10
    zones_config: []
    bombs_file: config/demo_bombs_map01.json
